[project]
name = "pymzm"
version = "0.0.1"
authors = [
  { name="Ahmad Othman", email="ahoth19@student.sdu.dk" },
]
description = "Create pure Minizinc .mzn files from Python using python-minizinc-maker library."
readme = "README.md"
requires-python = ">=3.8.0"
dependencies = [
  "minizinc",
  "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Arthod/python-minizinc-maker"
"Bug Tracker" = "https://github.com/Arthod/python-minizinc-maker/issues"

[tool.pytest.ini_options]
markers = [
  "unit: fast tests that do not require MiniZinc runtime",
  "integration: tests that require MiniZinc solver/runtime",
  "snapshot: deterministic text rendering regression tests",
  "property: equivalence and property-style tests",
  "no_mzn_verify: skip global MiniZinc CLI validation for tests that intentionally render unresolved include paths",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
  "F403", # package exports and core modules intentionally use wildcard imports
  "F405", # project relies on re-export style imports in core DSL modules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "F401", # many scenario tests keep exploratory imports
  "F841", # tests sometimes keep named variables for readability
  "E741", # legacy variable names in classic combinatorics examples
  "E712", # explicit boolean equality kept in tests for intent clarity
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = [
  "override",
  "assignment",
  "arg-type",
  "return-value",
  "operator",
  "list-item",
  "attr-defined",
]

[tool.coverage.run]
source = ["pymzm"]

[tool.coverage.report]
include = [
  "src/pymzm/expression.py",
  "src/pymzm/model.py",
  "src/pymzm/constraint.py",
  "src/pymzm/backends/*.py",
]
fail_under = 75