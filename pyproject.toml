[project]
name = "pymzm"
version = "0.0.1"
authors = [
  { name="Ahmad Othman", email="ahoth19@student.sdu.dk" },
]
description = "Create pure Minizinc .mzn files from Python using python-minizinc-maker library."
readme = "README.md"
requires-python = ">=3.8.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Arthod/python-minizinc-maker"
"Bug Tracker" = "https://github.com/Arthod/python-minizinc-maker/issues"

[tool.pytest.ini_options]
markers = [
  "unit: fast tests that do not require MiniZinc runtime",
  "integration: tests that require MiniZinc solver/runtime",
  "snapshot: deterministic text rendering regression tests",
  "property: equivalence and property-style tests",
]